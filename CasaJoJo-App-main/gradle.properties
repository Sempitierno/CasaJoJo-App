# Memoria para el daemon de Gradle y codificación UTF-8 (los textos están en español).
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
# Configuración específica para el demonio del compilador Kotlin (evita que termine inesperadamente en KSP / arranque #1)
kotlin.daemon.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Usar AndroidX (obligatorio para Jetpack Compose y Room).
android.useAndroidX=true
# Estilo de código Kotlin oficial.
kotlin.code.style=official
# Clase R no transitiva (recomendado desde AGP 8).
android.nonTransitiveRClass=true
