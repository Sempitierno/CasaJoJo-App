# Memoria para el daemon de Gradle y codificación UTF-8 (los textos están en español).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Usar AndroidX (obligatorio para Jetpack Compose y Room).
android.useAndroidX=true
# Estilo de código Kotlin oficial.
kotlin.code.style=official
# Clase R no transitiva (recomendado desde AGP 8).
android.nonTransitiveRClass=true
